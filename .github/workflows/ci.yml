name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: file:../data/gateway.db
      # 32 zero bytes as base64 (must decode to exactly 32 bytes)
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GROK_DEFAULT_CWD: ${{ github.workspace }}
      GROK_CWD_ALLOWLIST: ${{ github.workspace }}
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 is EOL and predates the 2026-10-21 Brotli fix
          # (CVE-2026-111497). check-latest keeps this job on current 22.x
          # (>=22.23.4). engines stays >=20. release.yml stays on Node 24.
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure data directory
        run: mkdir -p data

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Typecheck / build
        run: npm run build

      - name: Unit + integration tests
        run: npm test
